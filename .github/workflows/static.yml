# Zola site deployment to GitHub Pages
name: Deploy Zola site to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Rebuilds daily so posts marked `scheduled = true` go live on their date
  # (scripts/scheduled_posts.py holds them back until then). 13:00 UTC is
  # early morning in the US. Scheduled runs only fire on the default branch.
  schedule:
    - cron: "0 13 * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build and deploy Zola site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject covert Unicode and whitespace marks
        # Same gate as PR validation, so a direct push cannot deploy a file
        # that still contains an invisible or lookalike mark.
        run: |
          python3 scripts/check_content_marks.py --self-test
          python3 scripts/check_content_marks.py

      - name: Block deploy when a draft post is due within 7 days
        # Upcoming posts wait as drafts dated for release. A draft whose date
        # is within the next 7 days (or already past) must be published,
        # scheduled, or rescheduled first, so the planned queue never silently
        # lapses. The daily scheduled run checks this after deploying instead,
        # so a due draft never blocks a scheduled post from going live.
        if: github.event_name != 'schedule'
        run: |
          python3 scripts/check_upcoming_drafts.py --self-test > /dev/null
          python3 scripts/check_upcoming_drafts.py

      - name: Block links to posts that are not live yet
        # Inline /blog/<slug>/ links must follow release order: published
        # posts link only to published posts, drafts only to earlier ones.
        # Forward references go in [extra] related, which renders once live.
        run: |
          python3 scripts/check_post_links.py --self-test > /dev/null
          python3 scripts/check_post_links.py

      - name: Hold scheduled posts back until their date
        # Posts with `scheduled = true` under [extra] and a future date get
        # `draft = true` in this checkout only, so Zola leaves them out of
        # every page, feed, taxonomy, and the sitemap. Nothing is committed.
        run: |
          python3 scripts/scheduled_posts.py --self-test > /dev/null
          python3 scripts/scheduled_posts.py --hide

      - name: Setup Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.19.2
      
      - name: Validate site before build
        run: |
          cd zola-site
          echo "Running Zola check to validate templates and content..."
          zola check
          
      - name: Build Zola site
        run: |
          cd zola-site
          zola build
      
      - name: Validate RSS feeds were generated
        run: |
          cd zola-site
          echo "Verifying RSS feed generation..."
          
          # Check if blog feed exists
          if [ ! -f "public/blog/atom.xml" ]; then
            echo "ERROR: Blog RSS feed not generated at public/blog/atom.xml"
            exit 1
          fi
          
          # Validate blog feed contains entries
          ENTRY_COUNT=$(grep -c "<entry" public/blog/atom.xml || echo "0")
          if [ "$ENTRY_COUNT" -eq "0" ]; then
            echo "ERROR: Blog RSS feed is empty (no entries found)"
            exit 1
          fi
          
          echo "✓ RSS feeds validated successfully ($ENTRY_COUNT blog posts in feed)"
          
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the built Zola site
          path: 'zola-site/public'
          
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      # GitHub Pages deployments can intermittently fail with
      # "Deployment failed, try again later." even when the build succeeds.
      # Wait briefly and retry once to ride out transient backend errors
      # before failing the workflow.
      - name: Wait before retrying deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Retry deploy to GitHub Pages
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Report drafts due within 7 days (scheduled runs)
        # Runs after the deploy so the daily release still goes out, then
        # fails the run (and notifies) if a draft needs attention. The hold
        # step above added `draft = true` to future scheduled posts in this
        # checkout; restore the content first so only real drafts are counted.
        if: always() && github.event_name == 'schedule'
        run: |
          git checkout -- zola-site/content/blog
          python3 scripts/check_upcoming_drafts.py
