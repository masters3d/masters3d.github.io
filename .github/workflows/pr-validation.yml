# PR validation workflow to check site builds correctly and RSS feeds are generated.
# Runs on every PR targeting master — catches broken links, build errors, and content issues
# BEFORE they reach the deployment workflow.
#
# IMPORTANT — to enforce this as a required check (block merging if it fails):
#   Repository Settings → Branches → Branch protection rules → master →
#   "Require status checks to pass before merging" → add "validate"
name: PR Validation

on:
  pull_request:
    branches: ["master"]
  # Allow manual trigger for testing
  workflow_dispatch:

# Limit permissions for security
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.19.2
      
      - name: Validate external links and internal structure
        # zola check crawls ALL external links and fails on any broken one (4xx/5xx).
        # This is the same check that runs in the deploy workflow, so a PR that
        # passes here will not cause a broken-link deploy failure on master.
        run: |
          cd zola-site
          echo "Running Zola check (validates templates, internal links, AND external links)..."
          zola check
          echo "✓ All links valid — no broken external or internal links found"
          
      - name: Build site
        run: |
          cd zola-site
          echo "Building site..."
          zola build
          
      - name: Validate RSS feeds are generated
        run: |
          cd zola-site
          echo "Checking for RSS feed files..."
          
          # Check if blog feed exists
          if [ ! -f "public/blog/atom.xml" ]; then
            echo "ERROR: Blog RSS feed not generated at public/blog/atom.xml"
            exit 1
          fi
          echo "✓ Blog RSS feed exists at public/blog/atom.xml"
          
          # Validate blog feed is not empty and contains entries
          ENTRY_COUNT=$(grep -c "<entry" public/blog/atom.xml || echo "0")
          if [ "$ENTRY_COUNT" -eq "0" ]; then
            echo "ERROR: Blog RSS feed is empty (no entries found)"
            exit 1
          fi
          echo "✓ Blog RSS feed contains $ENTRY_COUNT entries"

          # Validate the feed outputs EVERY published blog post (no truncation /
          # feed_limit silently dropping posts). Zola excludes drafts from feeds,
          # so exclude files with draft = true from the expected count. The
          # atom.xml template caps pages at config.extra.feed_limit when that is
          # set to a positive value, so the expected entry count is
          # min(post_count, feed_limit).
          POST_COUNT=$(find content/blog -name "*.md" -not -name "_index.md" -type f \
            -exec grep -L -E '^draft[[:space:]]*=[[:space:]]*true([[:space:]]*)$' {} + | wc -l)
          FEED_LIMIT=$(grep -E '^feed_limit[[:space:]]*=' config.toml | grep -oE '[0-9]+' | head -1)
          FEED_LIMIT=${FEED_LIMIT:-0}
          if [ "$FEED_LIMIT" -gt "0" ] && [ "$FEED_LIMIT" -lt "$POST_COUNT" ]; then
            EXPECTED="$FEED_LIMIT"
            echo "feed_limit=$FEED_LIMIT is active; feed is paginated to the newest $FEED_LIMIT of $POST_COUNT posts"
          else
            EXPECTED="$POST_COUNT"
          fi
          if [ "$ENTRY_COUNT" -ne "$EXPECTED" ]; then
            echo "ERROR: Blog RSS feed has $ENTRY_COUNT entries but expected $EXPECTED"
            echo "The feed must output all posts (or feed_limit of them when capped)."
            exit 1
          fi
          echo "✓ Blog RSS feed outputs the expected $EXPECTED posts"
          
          # Check if root feed exists
          if [ ! -f "public/atom.xml" ]; then
            echo "ERROR: Root RSS feed not generated at public/atom.xml"
            exit 1
          fi
          echo "✓ Root RSS feed exists at public/atom.xml"
          
          # Validate feed is valid XML (install xmllint if needed)
          if command -v xmllint >/dev/null 2>&1; then
            if ! xmllint --noout public/blog/atom.xml 2>/dev/null; then
              echo "ERROR: Blog RSS feed is not valid XML"
              exit 1
            fi
            echo "✓ Blog RSS feed is valid XML"
          else
            # Fallback: basic XML validation by checking for required tags
            if ! grep -q "<?xml version" public/blog/atom.xml || ! grep -q "</feed>" public/blog/atom.xml; then
              echo "ERROR: Blog RSS feed appears malformed (missing XML declaration or closing tag)"
              exit 1
            fi
            echo "✓ Blog RSS feed has basic XML structure"
          fi
          
          echo ""
          echo "=== RSS Feed Validation Summary ==="
          echo "✓ All RSS feeds generated successfully"
          echo "✓ Blog feed contains $ENTRY_COUNT posts"
          echo "✓ Feed structure validated"
          
      - name: Validate Markdown formatting (Prettier + markdownlint)
        # Blog Markdown is formatted by Prettier (wraps prose to 80 cols using
        # soft breaks, so the rendered HTML is unchanged) and linted by
        # markdownlint. This step FAILS the build if any file is not correctly
        # formatted or has a lint violation. To fix locally:
        #   npm install && python3 scripts/format_markdown.py
        run: |
          echo "Installing pinned Markdown tooling (Prettier + markdownlint)..."
          npm ci
          echo "Checking blog Markdown formatting and lint..."
          python3 scripts/format_markdown.py --check
          echo "✓ Blog Markdown is correctly formatted and lint-clean"

      - name: Validate date formats in blog posts
        run: |
          cd zola-site/content/blog
          echo "Checking blog post date formats..."
          
          # Check for quoted dates: date = "2024-01-01" (not update_date, etc.)
          QUOTED_DATES=$(grep -rE '^date[[:space:]]*=[[:space:]]*"[0-9]{4}-' . | wc -l || echo "0")
          # Check for unquoted dates: date = 2024-01-01 (explicitly excludes quote after =)
          UNQUOTED_DATES=$(grep -rE '^date[[:space:]]*=[[:space:]]*[0-9]{4}-' . | grep -v '"' | wc -l || echo "0")
          
          echo "Found $QUOTED_DATES blog posts with quoted dates"
          echo "Found $UNQUOTED_DATES blog posts with unquoted dates"
          
          # Check if dates are mixed (inconsistent)
          if [ "$QUOTED_DATES" -gt "0" ] && [ "$UNQUOTED_DATES" -gt "0" ]; then
            echo "WARNING: Mixed date formats detected. Consider using consistent format."
            echo "Both quoted and unquoted dates work in Zola 0.19.2+, but consistency is recommended."
          fi
          
          # Verify all posts have dates (matches any date line with flexible spacing)
          POSTS_WITHOUT_DATES=$(find . -name "*.md" -not -name "_index.md" -type f -exec grep -L '^date[[:space:]]*=' {} \; | wc -l)
          if [ "$POSTS_WITHOUT_DATES" -gt "0" ]; then
            echo "ERROR: Found $POSTS_WITHOUT_DATES blog posts without dates"
            find . -name "*.md" -not -name "_index.md" -type f -exec grep -L '^date[[:space:]]*=' {} \;
            exit 1
          fi
          
          echo "✓ All blog posts have date fields"

      - name: Validate blog post categories
        # Every blog post must declare exactly one category from the five fixed
        # editorial tracks. Fails if a post is missing a category or introduces a
        # category outside the approved set, so unknown tracks never ship.
        run: |
          cd zola-site/content/blog
          echo "Checking blog post categories against the five editorial tracks..."

          # The only allowed categories (editorial tracks). Keep in sync with
          # zola-site/config.toml taxonomies and templates/taxonomies/single.html.
          ALLOWED="Quest Engine|Engineering Systems|AI & Tools|Leadership & Teams|Field Notes"

          FAILED=0
          for f in $(find . -name "*.md" -not -name "_index.md" -type f); do
            # Only inspect the TOML front matter (between the first two +++ fences)
            # so category examples inside the post body are never miscounted.
            FRONT=$(awk 'NR==1 && $0=="+++"{infm=1; next} infm && $0=="+++"{exit} infm{print}' "$f")
            LINE=$(echo "$FRONT" | grep -E '^categories[[:space:]]*=' || true)
            if [ -z "$LINE" ]; then
              echo "ERROR: $f is missing a 'categories' field"
              FAILED=1
              continue
            fi

            # Pull each quoted value out of the array and validate it.
            VALUES=$(echo "$LINE" | grep -oE '"[^"]*"' | sed 's/"//g')
            if [ -z "$VALUES" ]; then
              echo "ERROR: $f has an empty 'categories' field"
              FAILED=1
              continue
            fi

            COUNT=$(echo "$VALUES" | wc -l)
            if [ "$COUNT" -ne "1" ]; then
              echo "ERROR: $f declares $COUNT categories; exactly one is required"
              FAILED=1
            fi

            while IFS= read -r cat; do
              if ! echo "$cat" | grep -qxE "$ALLOWED"; then
                echo "ERROR: $f uses unknown category '$cat'"
                echo "       Allowed: Quest Engine, Engineering Systems, AI & Tools, Leadership & Teams, Field Notes"
                FAILED=1
              fi
            done <<< "$VALUES"
          done

          if [ "$FAILED" -ne "0" ]; then
            echo "Category validation failed."
            exit 1
          fi
          echo "✓ All blog posts use exactly one approved editorial track"          
      - name: Upload build artifacts for inspection
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: built-site
          path: zola-site/public
          retention-days: 7
