# The URL the site will be built for
base_url = "https://masters3d.com"

# Site metadata
title = "Masters3d"
description = "Technical. Creative. Tactical. Director."

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

# Generate RSS feed
generate_feeds = true
feed_filenames = ["atom.xml"]

[markdown]
# Whether to do syntax highlighting
# Theme can be customised by setting the `highlight_theme` variable to a theme supported by Zola
highlight_code = true

# Configure taxonomies
taxonomies = [
    {name = "categories", feed = true},
    {name = "tags", feed = true},
]

[extra]
# Put all your custom variables here
google_analytics = "UA-5533092"
github_username = "masters3d"
tagline = "Technical. Creative. Tactical. Director."

# Blog configuration
blog_posts_per_page = 10
show_reading_time = true

[link_checker]
# skip_prefixes: add URL prefixes here to skip specific domains (e.g. ["https://example.com/"])
# xcancel.com is a flaky X/Twitter mirror that intermittently returns 503; skip it.
# YouTube rate-limits automated link checkers and returns 429 (Too Many Requests),
# which causes false-positive broken-link failures in CI; skip both youtube.com and youtu.be.
# history.army.mil (US Army) blocks automated link checkers, so it fails validation
# even though the link is valid in a browser; skip it.
# developer.apple.com sits behind bot protection that returns 403 to automated
# checkers (Apple Developer Forums / archived docs), so it fails validation even
# though the links are valid in a browser; skip it.
# syntax.fm is a client-rendered SPA whose deep transcript routes are not reliably
# resolvable by automated link checkers; the link is valid in a browser, so skip it.
skip_prefixes = [
    "https://xcancel.com/",
    "https://www.youtube.com/",
    "https://youtube.com/",
    "https://youtu.be/",
    "https://history.army.mil/",
    "https://developer.apple.com/",
    "https://syntax.fm/",
]
# skip_anchor_prefixes: add URL prefixes here to skip anchor checking for specific domains
# Note: zola check always validates external links — this is intentional.
# To skip a known-flaky domain, add its prefix to skip_prefixes above.
