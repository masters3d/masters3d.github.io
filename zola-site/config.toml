# The URL the site will be built for
base_url = "https://masters3d.com"

# Site metadata
title = "Masters3d"
description = "Technical. Creative. Tactical. Director."

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

# Generate RSS feed
generate_feeds = true
feed_filenames = ["atom.xml"]

[markdown]
# Whether to do syntax highlighting
# Theme can be customised by setting the `highlight_theme` variable to a theme supported by Zola
highlight_code = true

# Configure taxonomies
taxonomies = [
    {name = "categories", feed = true},
    {name = "tags", feed = true},
]

[extra]
# Put all your custom variables here
google_analytics = "UA-5533092"
github_username = "masters3d"
tagline = "Technical. Creative. Tactical. Director."

# Blog configuration
blog_posts_per_page = 10
show_reading_time = true

[link_checker]
# skip_prefixes: add URL prefixes here to skip specific domains (e.g. ["https://example.com/"])
# xcancel.com is a flaky X/Twitter mirror that intermittently returns 503; skip it.
# YouTube rate-limits automated link checkers and returns 429 (Too Many Requests),
# which causes false-positive broken-link failures in CI; skip both youtube.com and youtu.be.
skip_prefixes = [
    "https://xcancel.com/",
    "https://www.youtube.com/",
    "https://youtube.com/",
    "https://youtu.be/",
]
# skip_anchor_prefixes: add URL prefixes here to skip anchor checking for specific domains
# Note: `zola check` always validates external links. CI runs it through
# scripts/check-links.sh, which tolerates links that merely could not be reached
# (network errors, timeouts, rate-limiting, transient 5xx) but still fails on
# genuinely broken links (404, missing anchors). To permanently skip a known-flaky
# domain, add its prefix to skip_prefixes above.
