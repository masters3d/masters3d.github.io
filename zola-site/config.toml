# The URL the site will be built for
base_url = "https://masters3d.com"

# Site metadata
title = "Masters3d"
description = "Technical. Creative. Tactical. Director."

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

# Generate RSS feed
generate_feeds = true
feed_filenames = ["atom.xml"]

# Configure taxonomies
taxonomies = [
    {name = "categories", feed = true},
    {name = "tags", feed = true},
]

[markdown]
# Whether to do syntax highlighting
# Theme can be customised by setting the `highlight_theme` variable to a theme supported by Zola
highlight_code = true

[extra]
# Put all your custom variables here
google_analytics = "UA-5533092"
github_username = "masters3d"
tagline = "Technical. Creative. Tactical. Director."

# Blog configuration
blog_posts_per_page = 10
show_reading_time = true

# RSS/Atom feed pagination.
# The custom feed template (templates/atom.xml) caps the feed to the most recent
# `feed_limit` posts so it stays a manageable size once the archive grows large.
# 0 (the default) outputs every post; set a positive number (e.g. 25) to enable
# capping once the full feed becomes too long.
feed_limit = 0

[link_checker]
# skip_prefixes: add URL prefixes here to skip specific domains (e.g. ["https://example.com/"])
# xcancel.com is a flaky X/Twitter mirror that intermittently returns 503; skip it.
# YouTube rate-limits automated link checkers and returns 429 (Too Many Requests),
# which causes false-positive broken-link failures in CI; skip both youtube.com and youtu.be.
# history.army.mil (US Army) blocks automated link checkers, so it fails validation
# even though the link is valid in a browser; skip it.
# developer.apple.com sits behind bot protection that returns 403 to automated
# checkers (Apple Developer Forums / archived docs), so it fails validation even
# though the links are valid in a browser; skip it.
# developer.android.com (Google) similarly bot-protects its reference docs and
# returns errors to automated checkers even though the links are valid; skip it.
# syntax.fm is a client-rendered SPA whose deep transcript routes are not reliably
# resolvable by automated link checkers; the link is valid in a browser, so skip it.
# archive.org (Internet Archive) intermittently returns 503 (Service Unavailable) to
# automated checkers under load, causing false-positive broken-link failures in CI;
# the link is valid in a browser, so skip it.
# learning.oreilly.com (O'Reilly) requires an authenticated subscription, so the
# library/video links return 4xx to anonymous automated checkers even though they
# are valid for logged-in readers; skip it.
# These CDC and Simon & Schuster pages return 403 to automated link checkers even
# though the specific references remain valid in a browser; skip only those URLs.
# douggregor.net is the personal blog the "Rust for Swift Practitioners" series
# attributes as inspiration; skip it so its bot-handling behavior can never flake
# the link check (the reference is valid in a browser).
skip_prefixes = [
    "https://xcancel.com/",
    "https://learning.oreilly.com/",
    "https://www.youtube.com/",
    "https://youtube.com/",
    "https://youtu.be/",
    "https://history.army.mil/",
    "https://developer.apple.com/",
    "https://developer.android.com/",
    "https://syntax.fm/",
    "https://archive.org/",
    "https://www.cdc.gov/sleep/about/index.html",
    "https://www.cdc.gov/physical-activity-basics/guidelines/adults.html",
    "https://www.simonandschuster.com/books/Solve-for-Happy/Mo-Gawdat/9781501157585",
    "https://www.douggregor.net/",
]
# skip_anchor_prefixes: add URL prefixes here to skip anchor checking for specific domains
# Note: zola check always validates external links — this is intentional.
# To skip a known-flaky domain, add its prefix to skip_prefixes above.
